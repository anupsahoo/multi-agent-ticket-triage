# Continuous integration: every push and pull request must pass the engine's
# tests and the console's typecheck, lint and production build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine · pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Smoke-run the CLI on every sample path
        run: python run.py --file samples/tickets.txt
      - name: Eval floor — the stub baseline must score 1.00 on every step of the chain
        run: python run.py --eval --floor routing=1 --floor tool_choice=1 --floor arguments=1 --floor outcome=1 --floor confident_wrong=0

  console:
    name: Console · typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version comes from package.json's packageManager field
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
