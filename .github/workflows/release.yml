# Release: pushing a tag like v1.2.0 runs the full CI checks again, then
# publishes a GitHub Release with auto-generated notes. Production deployment
# is handled by Vercel's Git integration on main, so a release is a marker of
# what is live, not a separate deploy step.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  verify:
    name: Verify before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - uses: pnpm/action-setup@v4   # version comes from package.json's packageManager field
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint && pnpm build

  publish:
    name: Publish GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create the release with generated notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Deployed to production by Vercel from `main`.

            **Verify a release locally**
            ```bash
            git checkout ${{ github.ref_name }}
            ./dev.sh
            ```
