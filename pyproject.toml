[project]
name = "multi-agent-ticket-triage"
version = "0.1.0"
description = "Multi-agent support-ticket triage on LangGraph: router, specialists, escalation, pluggable connectors."
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0",
  "langchain-core>=1.0",
  "pydantic>=2.0",
]

[project.optional-dependencies]
# A real language model: `pip install -e ".[llm]"` plus the provider package
# for the model named in LLM_MODEL (langchain-openai,
# langchain-ollama, langchain-google-genai, ...).
llm = ["langchain>=1.0"]
# Calibrated decisions via Jev (TypeSafe AI).
jev = ["langchain-typesafe>=0.0.1a3"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["triage*"]
